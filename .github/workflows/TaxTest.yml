name: TaxTest

on:   # 必須要有觸發事件
  push:
    branches:
      - main
  workflow_dispatch:   # 允許手動觸發

env:   # 頂層環境變數，影響所有 jobs
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run script
        run: python3 Tax3.py


